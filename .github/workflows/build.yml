name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  XIAOZHI_OTA_URL: ${{ secrets.XIAOZHI_OTA_URL }}
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
  KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Siapkan Gradle wrapper
        run: chmod +x gradlew

      - name: Build APK debug
        run: |
          if [ -n "$XIAOZHI_OTA_URL" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace -PXIAOZHI_OTA_URL="$XIAOZHI_OTA_URL"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Build APK release unsigned
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: |
          if [ -n "$XIAOZHI_OTA_URL" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace -PXIAOZHI_OTA_URL="$XIAOZHI_OTA_URL"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Build APK release signed
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PKEYSTORE_FILE=release.keystore \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: XiaozhiAndroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: XiaozhiAndroid-release-apk
          path: app/build/outputs/apk/release/*.apk
