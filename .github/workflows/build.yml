name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XIAOZHI_OTA_URL: ${{ secrets.XIAOZHI_OTA_URL }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Info URL OTA
        run: |
          if [ -n "$XIAOZHI_OTA_URL" ]; then
            echo "Memakai URL OTA dari secret: $XIAOZHI_OTA_URL"
          else
            echo "Secret XIAOZHI_OTA_URL kosong, memakai default"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Siapkan Gradle wrapper
        run: chmod +x gradlew

      - name: Build APK debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          XIAOZHI_OTA_URL: ${{ env.XIAOZHI_OTA_URL }}

      - name: Build APK release unsigned
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          XIAOZHI_OTA_URL: ${{ env.XIAOZHI_OTA_URL }}

      - name: Build APK release signed (jika secrets ada)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PKEYSTORE_FILE=release.keystore \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"
        env:
          XIAOZHI_OTA_URL: ${{ env.XIAOZHI_OTA_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: XiaozhiAndroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: XiaozhiAndroid-release-apk
          path: app/build/outputs/apk/release/*.apk
